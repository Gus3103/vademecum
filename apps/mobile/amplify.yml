version: 1
frontend:
  phases:
    preBuild:
      commands:
        # Build shared package first (monorepo dependency)
        - cd ../../packages/shared && npm install && npm run build && cd ../../apps/mobile
        - npm install --legacy-peer-deps
    build:
      commands:
        - npm run build:web
  artifacts:
    baseDirectory: dist
    files:
      - '**/*'
  cache:
    paths:
      - node_modules/**/*
      - ../../node_modules/**/*
      - ../../packages/shared/node_modules/**/*
